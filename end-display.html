<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../assets/lingolab-logo.png" />
    <meta name="description" content="See example sentences translated into your new LingoLab language." />
    <title>End Display | LingoLab</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/create.css" />
    <script src="js/end-display.js" defer></script>
  </head>
  <body>
    <div class="create-shell tc-shell">
      <header class="site-header create-header"><a class="brand" href="../index.html#top" aria-label="LingoLab home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#123d57" /><path d="M24 6v36M8 24h32M12 13c7 6 16 9 25 8M12 35c7-6 16-9 25-8" fill="none" stroke="#3d93a1" stroke-width="1.6" opacity=".75" /><path d="M16 11v22h13" fill="none" stroke="#f5b941" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M21 8v22h13" fill="none" stroke="#ef6d52" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" /></svg></span><span class="brand-name"><span>Lingo</span><em>Lab</em></span></a><nav class="main-nav" aria-label="Main navigation"><a href="../index.html#top">Home</a><a href="explore.html">Explore</a><a class="active" href="create.html">Create</a><a href="about.html">About</a></nav><a class="sign-in" href="../index.html#top">Sign in</a></header>

      <main class="create-main tc-wrap">
        <section class="flow-intro">
          <p class="eyebrow">Your language · End display</p>
          <h1>Pulling it all <em>Together</em></h1>
          <p>Choose a sentence from the drop down menu to see how it’s translated in your language!</p>
        </section>

        <section class="tc-card" aria-label="End display">
          <label class="tc-label" for="sentence-select">Example sentence</label>
          <select class="ed-select" id="sentence-select">
            <option value="" disabled selected>Choose a sentence!</option>
          </select>

          <div class="tc-translation">
            <p class="tc-label">Translation</p>
            <p class="ed-output empty" id="translation-output" aria-live="polite">Your translation will show up here.</p>
          </div>
        </section>

        <div class="tc-actions">
          <a class="tc-btn tc-back" href="translation-challenge.html">Back to Translation Challenge</a>
        </div>
      </main>
    </div>
  </body>
</html>
