<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../../assets/lingolab-logo.png" />
    <meta name="description" content="Translate English sentences into your new LingoLab language." />
    <title>Translation Challenge | LingoLab</title>
    <link rel="stylesheet" href="../../css/styles.css" />
    <link rel="stylesheet" href="../../css/create.css" />
    <script src="../../js/translation-challenge.js" defer></script>
    <script src="../../js/site-header.js" defer></script>
</head>
  <body>
    <div class="create-shell tc-shell">
      <header class="site-header create-header"><a class="brand" href="../../index.html#top" aria-label="LingoLab home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#123d57" /><path d="M24 6v36M8 24h32M12 13c7 6 16 9 25 8M12 35c7-6 16-9 25-8" fill="none" stroke="#3d93a1" stroke-width="1.6" opacity=".75" /><path d="M16 11v22h13" fill="none" stroke="#f5b941" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M21 8v22h13" fill="none" stroke="#ef6d52" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" /></svg></span><span class="brand-name"><span>Lingo</span><em>Lab</em></span></a><nav class="main-nav" aria-label="Main navigation"><a href="../../index.html#top">Home</a><a href="../explore.html">Explore</a><a class="active" href="../create.html">Create</a><a href="../about.html">About</a></nav><a class="sign-in" href="../../index.html#top">Sign in</a></header>

      <main class="create-main tc-wrap">
        <section class="flow-intro">
          <p class="eyebrow">Your language · Translation challenge</p>
          <h1>Your new language in <em>sentences.</em></h1>
          <p>Translate the English sentence below into your new language!</p>
          <p class="flow-instruction"><strong>Hint: Use your language report to help you out!</strong></p>
        </section>

        <section class="tc-card" aria-label="Translation challenge">
          <label class="tc-label" for="english-sentence">Example sentence</label>
          <input class="tc-english" id="english-sentence" type="text" readonly />

          <div class="tc-translation">
            <label class="tc-label" for="translation-input">Translation</label>
            <input class="tc-input" id="translation-input" type="text" placeholder="Type your translation here" autocomplete="off" autocapitalize="off" spellcheck="false" />
          </div>

          <p class="tc-feedback" id="feedback" role="status" aria-live="polite" hidden></p>
        </section>

        <div class="tc-actions">
          <button class="tc-btn tc-submit" id="submit-btn" type="button">Submit</button>
        </div>
        <div class="tc-actions">
          <a class="tc-btn tc-back" href="language-report.html">Back to Language Report</a>
          <button class="tc-btn tc-retry" id="retry-btn" type="button">Try the challenge again</button>
        </div>
      </main>
    </div>
  </body>
</html>
